name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling Go API contract source
        uses: actions/checkout@v4
        with:
          repository: noah-isme/sma-adp-api
          ref: main
          path: ../sma-adp-api
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm test
      - run: pnpm -r test

  migrate:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.DATABASE_URL != ''
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling Go API for migrations
        uses: actions/checkout@v4
        with:
          repository: noah-isme/sma-adp-api
          ref: main
          path: ../sma-adp-api
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: cd ../sma-adp-api && make migrate-up
