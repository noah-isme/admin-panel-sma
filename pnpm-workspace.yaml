packages:
  - "apps/*"
  - "packages/*"
  - "infra"

# Keep security pins in the workspace configuration. Recent pnpm versions no
# longer read `pnpm.overrides` from the root package.json.
overrides:
  "@smithy/config-resolver": "4.7.2"
  "brace-expansion": "2.1.4"
  "fast-xml-parser": "5.7.0"
  "follow-redirects": "1.16.0"
  "form-data": "4.0.6"
  "lodash": "4.18.1"
  "lodash-es": "4.18.1"
  "minimatch": "5.1.8"
  "@ant-design/pro-layout>path-to-regexp": "8.4.0"
  "qs": "6.15.3"
  "uuid": "11.1.1"
  "yaml": "1.10.3"
