services:
  admin:
    image: node:20-bullseye
    working_dir: /workspace/apps/admin
    volumes:
      - ./:/workspace:cached
      - /workspace/node_modules
    environment:
      - VITE_API_URL=http://host.docker.internal:8081/api/v1
    ports:
      - "5173:5173"
    command: >
      bash -lc "npm install -g pnpm@latest && pnpm --filter @apps/admin install && pnpm --filter @apps/admin dev"

# Usage:
# docker compose -f docker-compose.dev.yml -f docker-compose.dev.override.yml up --build
# This will run the admin dev server. Backend is now provided by sma-adp-api (Go) on port 8081.
